name: run tests
on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the tests; created before the steps, deleted at the end.
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        # Steps start only after Postgres accepts connections, avoiding flaky tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_journal
    # Replaces the local .env file, which is never committed.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_journal
    steps:
      - uses: actions/checkout@v7
      # Full version on purpose: since v8 this action publishes no major-only tags,
      # and immutable tags protect against a tag being moved to malicious code.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      # Style checks only report, never fix: fixes on this throwaway machine would be lost.
      # They run before the tests because they take a fraction of a second.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Build the schema on the empty database: a broken migration fails here,
      # before deploy, and the tests get the tables they need.
      - run: uv run python -m app.migrate
      - run: uv run python -m pytest
